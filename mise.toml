[tools]
node = "24"
"npm:markdownlint-cli2" = "0.24.0"
pnpm = "12.16.1"

[tasks.dev]
description = "Run the home page on a local server"
run = "pnpm astro dev"

[tasks.build]
description = "Build the home page into dist/"
run = "pnpm astro build"

[tasks.check]
description = "Type check the Astro pages and scripts"
run = "pnpm astro check"

[tasks.preview]
description = "Serve the built dist/ folder"
run = "pnpm astro preview"

[tasks.lint]
description = "Lint the home page and check the format of the whole repo"
run = ["markdownlint-cli2", "pnpm lint", "pnpm format:check"]

[tasks.format]
description = "Format the whole repo with oxfmt"
run = "pnpm format"

[tasks.test]
description = "Check that each language catalog matches English"
run = "pnpm test"
