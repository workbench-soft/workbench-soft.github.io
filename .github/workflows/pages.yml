name: Pages

# Publishes https://workbench-soft.github.io on each push to main.
# The repo is public, so the hosted runner spends no Actions minutes.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Each job gets only what it needs. The deploy alone may write to Pages.
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
      - name: Build the home page
        run: |
          mise x -- pnpm install --frozen-lockfile
          mise run check
          mise run build
      - name: Build the Memories site
        uses: actions/jekyll-build-pages@44a6e6beabd48582f863aeeb6cb2151cc1716697 # v1.0.13
        with:
          source: ./memories-mobile
          destination: ./_site/memories-mobile
      # The Jekyll step runs in a container as root, so _site belongs to root.
      - name: Add the home page and the root files
        run: |
          sudo cp -r dist/. _site/
          sudo cp app-ads.txt robots.txt _site/
          sudo cp -r langflip _site/
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
