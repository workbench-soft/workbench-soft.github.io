name: Private

# Checks the insiders page on pull requests. A push to main deploys it to Cloudflare.
# Cloudflare Access guards its host. The Worker also checks the Access token, so a deploy before Access is set up answers 403.
on:
  pull_request:
    paths: ['apps/private/**', 'src/i18n/locales.ts', 'src/i18n/shape.ts', '.github/workflows/private.yml']
  push:
    branches: [main]
    paths: ['apps/private/**', 'src/i18n/locales.ts', 'src/i18n/shape.ts', '.github/workflows/private.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/private
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # Node and pnpm come from apps/private/mise.toml, the same pins as on the PC.
      - uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10
        with:
          working_directory: apps/private
      - run: mise x -- pnpm install --frozen-lockfile
      - run: mise run check

  deploy:
    needs: check
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.CLOUDFLARE_ACCOUNT_ID != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: private-deploy
      cancel-in-progress: false
    defaults:
      run:
        working-directory: apps/private
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10
        with:
          working_directory: apps/private
      - run: mise x -- pnpm install --frozen-lockfile
      # Only the wrangler step gets the token, so install scripts of the dependencies can't read it.
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: mise x -- pnpm exec wrangler deploy
