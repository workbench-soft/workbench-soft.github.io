name: Games

# Checks the games and the edge on pull requests. A push to main deploys both to Cloudflare.
# The repo is public, so the hosted runner spends no Actions minutes.
on:
  pull_request:
    paths: ['apps/**', 'registry.json', '.github/workflows/games.yml']
  push:
    branches: [main]
    paths: ['apps/**', 'registry.json', '.github/workflows/games.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The Pages workflow skips pull requests that touch only apps/, but its lint on main checks the format
  # and the Markdown of apps/ too. So the same lint runs here first.
  site-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
      - run: |
          mise x -- pnpm install --frozen-lockfile
          mise run lint

  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        app: [games, edge]
    defaults:
      run:
        working-directory: apps/${{ matrix.app }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # Node and pnpm come from the mise.toml of each app, the same pins as on the PC.
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          working_directory: apps/${{ matrix.app }}
      - run: mise x -- pnpm install --frozen-lockfile
      - run: mise run check
      - if: matrix.app == 'games'
        run: mise run build

  # The games deploy first, so the edge binds to a Worker that exists.
  deploy:
    needs: check
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.CLOUDFLARE_ACCOUNT_ID != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Deploys queue, so two pushes never run wrangler at once.
    concurrency:
      group: games-deploy
      cancel-in-progress: false
    # Only the wrangler steps get the token, so install scripts of the dependencies can't read it.
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          working_directory: apps/games
      - name: Build the games
        working-directory: apps/games
        env:
          PUBLIC_ADSENSE_CLIENT: ${{ vars.ADSENSE_CLIENT }}
          PUBLIC_ADSENSE_SLOT_PAGE: ${{ vars.ADSENSE_SLOT_PAGE }}
          PUBLIC_ADSENSE_SLOT_ROOM: ${{ vars.ADSENSE_SLOT_ROOM }}
        run: mise x -- pnpm install --frozen-lockfile && mise run build
      - name: Deploy the games
        working-directory: apps/games
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: mise x -- pnpm exec wrangler deploy
      # Off: the games have their own host, and the apex of workbench-soft.com stays on GitHub Pages.
      - name: Install the edge
        if: vars.EDGE_ENABLED == 'true'
        working-directory: apps/edge
        run: mise x -- pnpm install --frozen-lockfile
      - name: Deploy the edge
        if: vars.EDGE_ENABLED == 'true'
        working-directory: apps/edge
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: mise x -- pnpm exec wrangler deploy
