<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang | default: "en" }}">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
{% seo %}
    <link rel="stylesheet" href="{{ "/assets/css/style.css?v=" | append: site.github.build_revision | relative_url }}">
    <link rel="icon" type="image/png" sizes="32x32" href="{{ "/assets/favicon-32.png" | relative_url }}">
    <link rel="apple-touch-icon" href="{{ "/assets/apple-touch-icon.png" | relative_url }}">
    <link rel="manifest" href="{{ "/site.webmanifest" | relative_url }}">
    {% include analytics.html %}
    <style>
      @media (prefers-color-scheme: dark) {
        :root { color-scheme: dark; }
        body { background: #0d1117; color: #e6edf3; }
        .markdown-body { color: #e6edf3; }
        .markdown-body a { color: #4493f8; }
        .markdown-body h1, .markdown-body h2 { border-bottom-color: #30363d; }
        .markdown-body code, .markdown-body pre, .markdown-body table tr:nth-child(2n) { background: #161b22; }
        .markdown-body table td, .markdown-body table th, .markdown-body hr, .border-top { border-color: #30363d !important; }
        .markdown-body blockquote, .text-gray { color: #9198a1 !important; }
      }
    </style>
    <script>
      // The visit counter loads once the page has loaded and painted. Its connection to a second host would otherwise delay the first paint on a slow network.
      {
        const counter = () => {
          const s = document.createElement("script");
          s.src = "https://static.cloudflareinsights.com/beacon.min.js";
          s.dataset.cfBeacon = '{"token": "f5de78701e794dfc9e06d753109f57d5"}';
          document.head.append(s);
        };
        const loaded = () => (document.readyState === "complete" ? counter() : addEventListener("load", counter, { once: true }));
        if (PerformanceObserver.supportedEntryTypes?.includes("paint")) {
          new PerformanceObserver((_, o) => (o.disconnect(), loaded())).observe({ type: "paint", buffered: true });
        } else loaded();
      }
    </script>
  </head>
  <body>
    <div class="container-lg px-3 my-5 markdown-body">
      {% unless page.url == "/" %}
      <p class="f3 text-bold"><a href="{{ "/" | relative_url }}">{{ site.title }}</a></p>
      {% endunless %}

      {{ content }}

      <footer class="border-top border-gray-light mt-5 pt-3 text-gray">
        <a href="{{ "/" | relative_url }}">Home</a> ·
        <a href="https://workbench-soft.com/#memories">{{ site.title }} on workbench-soft.com</a> ·
        <a href="https://play.google.com/store/apps/details?id=com.workbenchsoft.memories">{{ site.title }} on Google Play</a> ·
        <a href="{{ "/guides/" | relative_url }}">Guides</a> ·
        <a href="{{ "/about.html" | relative_url }}">About</a> ·
        <a href="{{ "/privacy-policy.html" | relative_url }}">Privacy policy</a> ·
        <a href="mailto:hello@workbench-soft.com">Contact</a>
      </footer>
    </div>
  </body>
</html>
